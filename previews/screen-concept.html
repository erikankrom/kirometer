<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kirometer · animated screen concept</title>
<style>
:root{--purple-300:hsl(264 100% 81%);--purple-500:hsl(264 100% 64%);--prey-900:hsl(266 14% 10%);--prey-750:hsl(264 12% 16%);--prey-300:hsl(263 7% 76%);--grey-200:hsl(30 5% 92%)}
*{box-sizing:border-box}body{margin:0;background:var(--prey-900);color:var(--grey-200);font-family:'AWS Diatype',Arial,sans-serif;min-height:100vh;display:grid;place-items:center}main{padding:36px;width:min(100%,720px)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}h1{font-size:23px;font-weight:400;margin:0}.tag{font-size:12px;color:var(--prey-300);border:1px solid var(--prey-750);padding:8px 12px;border-radius:24px}.screen{width:min(100%,480px);aspect-ratio:1;margin:auto;border-radius:54px;border:1px solid var(--prey-750);background:#07050b;overflow:hidden;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}.label{font-size:12px;letter-spacing:.12em;color:var(--prey-300);position:absolute;top:34px}.ghost{width:150px;height:172px;animation:float 3.5s ease-in-out infinite;filter:drop-shadow(0 6px 18px #9147ff30)}.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}.meter{position:absolute;bottom:42px;width:70%}.numbers{display:flex;justify-content:space-between;font-size:13px;margin-bottom:12px;color:var(--prey-300)}.track{height:5px;background:var(--prey-750);border-radius:8px;overflow:hidden}.fill{height:100%;width:74%;background:var(--purple-500);border-radius:8px}p{color:var(--prey-300);font-size:14px;line-height:1.7;max-width:480px;margin:24px auto 0}button{font:inherit;background:var(--purple-500);color:white;border:0;border-radius:24px;padding:10px 18px;cursor:pointer;display:block;margin:22px auto}.working .ghost{animation-duration:.85s}.working .label{color:var(--purple-300)}@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-9px) rotate(3deg)}}@keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.08)}}@media(prefers-reduced-motion:reduce){.ghost,.eye{animation:none}}
</style>
<main><header><h1>kirometer</h1><span class="tag">Screen concept</span></header>
<div class="screen" id="screen" role="img" aria-label="Animated Kiro ghost with illustrative credit utilization">
<span class="label" id="state">READY</span>
<svg class="ghost" viewBox="0 0 100 115" aria-hidden="true"><path fill="white" d="M52 6 C77 4 91 24 92 47 C95 75 84 100 68 108 C60 112 56 108 53 102 C43 110 26 114 22 103 C19 96 23 86 25 83 C10 91 3 82 9 71 C17 57 16 40 20 27 C25 12 39 5 52 6Z"/><ellipse class="eye" cx="51" cy="43" rx="5" ry="8" fill="#08060b"/><ellipse class="eye" cx="69" cy="43" rx="5" ry="8" fill="#08060b"/></svg>
<div class="meter"><div class="numbers"><span>Credits remaining</span><span>74% · demo</span></div><div class="track"><div class="fill"></div></div></div></div>
<button id="toggle">Preview working state</button>
<p>Illustrative animation and sample values. Uses Kiro website color tokens and a mascot based on the app icon. The live reader is separate; this preview does not read telemetry or flash firmware.</p></main>
<script>const screen=document.getElementById('screen'),button=document.getElementById('toggle');button.onclick=()=>{const active=screen.classList.toggle('working');document.getElementById('state').textContent=active?'WORKING':'READY';button.textContent=active?'Preview ready state':'Preview working state'};</script></html>
